# Run LLMs locally using Docker on Fedora 43

# Laptop specs:
# - AMD Ryzen 5 PRO 3500U w/ Radeon Vega Mobile Gfx
# - 16 GB RAM

# Pull LLMs from: https://ollama.com/search
# docker exec -it ollama ollama pull gemma4:e2b

# Run LLM using cli:
# docker exec -it ollama ollama run gemma4:e2b

services:
  ollama:
    image: ollama/ollama:0.30.6
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
#    group_add:
#      - video
#      - render
    # Optional: Required on some hosts to allow memory mapping for compute
    security_opt:
      - seccomp:unconfined
    environment:
      - OLLAMA_VULKAN=1
      - AMD_VULKAN_ICD=RADV
      # Optional: Force detection if iGPU is missed
      - OLLAMA_IGPU_ENABLE=1

volumes:
  ollama_data:
